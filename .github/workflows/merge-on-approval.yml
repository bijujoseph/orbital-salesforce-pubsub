name: Merge on approval

on:
  pull_request_review:
    types:
      - submitted

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.review.state == 'approved' && github.event.pull_request.state == 'open' && github.event.review.user.login != github.event.pull_request.user.login && github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-latest
    steps:
      - id: verify_approval
        name: Verify approval still applies
        run: |
          IFS=$'\t' read -r current_head review_decision < <(
            gh pr view "$PR_URL" --json headRefOid,reviewDecision --jq '[.headRefOid, (.reviewDecision // "")] | @tsv'
          )

          if [ "$current_head" != "$REVIEW_COMMIT_ID" ] || [ "$review_decision" != "APPROVED" ]; then
            echo "Approval no longer applies to the current head; skipping auto-merge enablement."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_merge=true" >> "$GITHUB_OUTPUT"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEW_COMMIT_ID: ${{ github.event.review.commit_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge (squash)
        if: steps.verify_approval.outputs.should_merge == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
