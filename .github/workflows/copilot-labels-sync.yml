name: Copilot review label sync
# Polls open PRs every 5 minutes and reconciles copilot-approved /
# copilot-changes-requested labels based on the latest Copilot review.
# The initial "copilot-reviewing" label is applied by copilot-labels.yml
# on the review_requested event.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to sync (optional)"
        required: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Use a PAT so label mutations don't require committer status.
      GH_TOKEN: ${{ secrets.ORBITAL_SF_REPO_PAT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Reconcile Copilot review labels
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ github.event.inputs.pr_number }}" ]]; then
            mapfile -t prs < <(printf '%s\n' "${{ github.event.inputs.pr_number }}")
          else
            mapfile -t prs < <(gh pr list --state open --json number --jq '.[].number')
          fi

          if [[ ${#prs[@]} -eq 0 ]]; then
            echo "No open PRs."
            exit 0
          fi

          for pr in "${prs[@]}"; do
            [[ -z "$pr" ]] && continue
            echo "::group::PR #$pr"

            pr_json=$(gh pr view "$pr" --json reviews,labels)

            latest_state=$(jq -r '
              [.reviews[]?
                | select((.author.login // "") | test("copilot"; "i"))]
              | sort_by(.submittedAt)
              | last
              | (.state // "")
            ' <<<"$pr_json")

            case "$latest_state" in
              APPROVED)
                desired="copilot-approved"
                ;;
              CHANGES_REQUESTED|COMMENTED|DISMISSED)
                desired="copilot-changes-requested"
                ;;
              *)
                desired=""
                ;;
            esac

            echo "PR #$pr latest_copilot_state=${latest_state:-<none>} desired=${desired:-<none>}"

            if [[ -z "$desired" ]]; then
              echo "::endgroup::"
              continue
            fi

            current_labels=$(jq -r '[.labels[].name] | join(",")' <<<"$pr_json")
            add_args=()
            remove_args=()

            if [[ ",$current_labels," != *",$desired,"* ]]; then
              add_args+=(--add-label "$desired")
            fi

            for lbl in copilot-reviewing copilot-approved copilot-changes-requested; do
              [[ "$lbl" == "$desired" ]] && continue
              if [[ ",$current_labels," == *",$lbl,"* ]]; then
                remove_args+=(--remove-label "$lbl")
              fi
            done

            if [[ ${#add_args[@]} -gt 0 || ${#remove_args[@]} -gt 0 ]]; then
              gh pr edit "$pr" "${add_args[@]}" "${remove_args[@]}"
            else
              echo "No label changes needed."
            fi
            echo "::endgroup::"
          done
