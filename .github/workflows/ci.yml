name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Maven verify
        run: |
          if [ -f pom.xml ]; then
            mvn -B -ntp verify
          else
            echo "No pom.xml found yet; skipping Maven verification."
          fi
