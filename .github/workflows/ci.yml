name: CI

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fast-build:
    name: Fast build
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate work plan when present
        if: hashFiles('docs/planning/v0.1-work-plan.yaml') != ''
        run: |
          python -m pip install --disable-pip-version-check --no-input "PyYAML>=6,<7"
          python tools/validate_work_plan.py \
            --plan docs/planning/v0.1-work-plan.yaml
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "**/*.md"
          config: ".markdownlint-cli2.yaml"
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # lychee excludes mail addresses by default; --exclude-mail was
          # removed from current lychee releases and makes the action fail
          # before it can inspect the Markdown files.
          args: --verbose --no-progress './**/*.md'
          fail: true
      - name: Run clean Maven verify
        run: |
          if [ ! -f pom.xml ]; then
            echo "No root pom.xml found yet; skipping Maven verification."
            exit 0
          fi
          mvn -B -ntp clean verify -Ddependency-check.skip=true
      - name: Verify packaged artifacts and BOM
        if: hashFiles('pom.xml') != ''
        run: bash .github/scripts/check-artifacts.sh

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Review pull-request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never

  # Keep this job id/name unchanged: branch protection requires the CI / ci
  # status context. It also prevents a fast-build success from bypassing the
  # dependency security gate.
  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - fast-build
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Require fast build and dependency review
        env:
          FAST_BUILD_RESULT: ${{ needs.fast-build.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FAST_BUILD_RESULT" != "success" || "$DEPENDENCY_REVIEW_RESULT" != "success" ]]; then
            echo "Fast build: $FAST_BUILD_RESULT"
            echo "Dependency review: $DEPENDENCY_REVIEW_RESULT"
            exit 1
          fi
          echo "Fast build and dependency review passed."
