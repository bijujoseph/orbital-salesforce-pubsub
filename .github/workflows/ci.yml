name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate work plan when present
        if: hashFiles('docs/planning/v0.1-work-plan.yaml') != ''
        run: |
          python -m pip install --disable-pip-version-check --no-input "PyYAML>=6,<7"
          python tools/validate_work_plan.py \
            --plan docs/planning/v0.1-work-plan.yaml
      - name: Run Maven verify
        run: |
          if [ ! -f pom.xml ]; then
            echo "No root pom.xml found yet; skipping Maven verification."
            exit 0
          fi
          mvn -B -ntp verify
