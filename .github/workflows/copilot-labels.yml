name: Copilot review labels
on:
  pull_request_target:
    types: [review_requested]
permissions:
  pull-requests: write
jobs:
  label:
    if: contains(github.event.requested_reviewer.login, 'copilot')
    runs-on: ubuntu-latest
    steps:
      - run: gh pr edit "$PR_URL" --add-label "copilot-reviewing"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
