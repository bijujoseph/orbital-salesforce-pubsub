name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java and Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Detect analyzable source
        id: detect-sources
        shell: bash
        run: |
          source_file="$(find . -type f \( -name '*.java' -o -name '*.kt' -o -name '*.proto' \) \
            -not -path './.git/*' -not -path '*/target/*' -print -quit)"
          if [[ -n "$source_file" ]]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "No Java, Kotlin, or protobuf source files are present; CodeQL analysis is deferred until implementation begins."
          fi
      - name: Initialize CodeQL
        if: steps.detect-sources.outputs.has_source == 'true'
        uses: github/codeql-action/init@v4.33.0
        with:
          languages: java-kotlin
          queries: security-and-quality
      - name: Build for CodeQL
        if: steps.detect-sources.outputs.has_source == 'true'
        run: mvn -B -ntp -Ddependency-check.skip=true -DskipTests compile
      - name: Upload CodeQL results
        if: steps.detect-sources.outputs.has_source == 'true'
        uses: github/codeql-action/analyze@v4.33.0
        with:
          category: "/language:java-kotlin"
          output: codeql-results
      - name: Enforce high-severity CodeQL findings
        if: steps.detect-sources.outputs.has_source == 'true'
        run: bash .github/scripts/check-codeql-security.sh codeql-results
