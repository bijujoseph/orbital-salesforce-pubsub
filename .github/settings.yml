repository:
  private: false
  has_projects: true
  has_wiki: false
  has_downloads: true
  default_branch: main
  topics:
    - salesforce
    - pub-sub-api
    - orbitalhq
    - taxi
    - grpc
    - platform-events
  vulnerability_alerts: true

branches:
  - name: main
    protection:
      required_pull_request_reviews: {}
      required_status_checks:
        strict: true
        contexts:
          - ci
          - Secret scan
          - Analyze Java and Kotlin
      enforce_admins: true
      required_linear_history: true
      allow_force_pushes: false
