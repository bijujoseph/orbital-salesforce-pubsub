      <!-- work-item-key: OSP-056 -->

      ## Goal
      Make connection, subscription, decode, reconnect, and publish behavior diagnosable through Orbital without high-cardinality or sensitive data.

      ## Scope
      Bridge the core telemetry SPI to Orbital tracing, required metrics, structured lifecycle logs, query/request context, and application-level health.

      ## Requirement Sources
      - Blueprint §§9.1-9.4 and adapter observability requirements in §8.1.

      ## Implementation Notes
      - Use replay hashes and low-cardinality labels; enable checkpoint/processing metrics only if OSP-051 proves their semantics.

      ## Acceptance Criteria
      - All always-required blueprint metrics are emitted with only connectionName, topic, outcome, or exceptionType labels as applicable.
      - Logs include appropriate connection/topic/consumer/service/operation/query/schema/retry/category context without credentials, full replay IDs, payloads, customer IDs, or PII labels.
      - Health reflects application lifecycle rather than raw channel state and maps transient retries, repeated decode failures, terminal auth/config failures, and graceful close correctly.
      - Conditional checkpoint-age/processing-duration metrics are absent unless justified by OSP-051 and tested against the actual acknowledgement boundary.

      ## Verification
      - Run metric/tracing snapshots, low-cardinality assertions, captured-log redaction tests, and supported-version health transition tests.

      ## Risks / Constraints
      - Topic labels are permitted but dynamically generated consumer or event identifiers are not metric labels.

      ## Likely Modules / Files
      - orbital-salesforce-connector/src/main/kotlin/
      - orbital-salesforce-connector/src/test/kotlin/
