    body: |
      <!-- work-item-key: OSP-012 -->

      ## Goal
      Turn the blueprint quality, security, coverage, license, and packaging requirements into deterministic build and CI gates.

      ## Scope
      Configure Java/Kotlin formatting, Detekt, Java static analysis, JaCoCo, dependency/license checks, Gitleaks, CodeQL, documentation checks, and package smoke verification.

      ## Requirement Sources
      - Blueprint §§10.1 and 11.1-11.3.
      - Repository evidence: current CI only validates the work plan and runs Maven verify when POMs exist; Dependabot is already configured for Maven.

      ## Implementation Notes
      - Apply the stated coverage thresholds, with the higher critical-package thresholds, and fail high-confidence security/correctness findings according to policy.

      ## Acceptance Criteria
      - Pull-request CI runs formatting, compilation, unit/fake/adapter tests, coverage, static analysis, dependency/license scanning, CodeQL, Gitleaks, package build, and artifact smoke checks.
      - Gitleaks and CodeQL both run on pull requests and on a scheduled scan, with findings surfaced as failing or blocking security results under the configured policy.
      - Core line/branch coverage gates are at least 80/70 percent and auth, replay, Avro, and state-machine gates are at least 90/85 percent.
      - No committed secret fixture is required by any check, and high/critical dependency findings receive a blocking review outcome under the configured policy.

      ## Verification
      - Run `mvn -B -ntp verify` and inspect a pull-request workflow run for every required check and threshold.
      - Inspect both pull-request and scheduled workflow runs for Gitleaks and CodeQL, and execute the configured secret, dependency, license, and code-security checks against a controlled failing fixture or documented test mode.

      ## Risks / Constraints
      - Tool selection may use only blueprint-approved equivalents and must keep CI usable without real Salesforce credentials on ordinary pull requests.

      ## Likely Modules / Files
      - pom.xml
      - .github/workflows/ci.yml
      - .github/workflows/codeql.yml
      - .gitleaks.toml
      - .github/dependabot.yml

