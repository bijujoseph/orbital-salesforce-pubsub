    body: |
      <!-- work-item-key: OSP-035 -->

      ## Goal
      Recover boundedly from transient transport and authentication failures while terminating permanent failures.

      ## Scope
      Implement exponential backoff with jitter, configurable attempts/max delay, UNAVAILABLE reconnect, UNAUTHENTICATED reauthentication, and terminal error classification.

      ## Requirement Sources
      - Blueprint §6.11 and retry/reconnect tests in §§10.2, 10.4, and 10.7.

      ## Implementation Notes
      - Initial delays follow 1, 2, 4, 8, 16, then 30 seconds maximum before jitter; resume uses the configured replay strategy.

      ## Acceptance Criteria
      - UNAVAILABLE schedules jittered exponential retries that respect configured attempt and maximum-delay limits.
      - UNAUTHENTICATED refreshes/reacquires the session, opens a new stream with refreshed metadata, and resumes from the intended replay selection.
      - PERMISSION_DENIED, invalid topic, and invalid configuration terminate without an unbounded retry loop.
      - Close/STOPPING cancels every scheduled reconnect and prevents later channel or stream creation.

      ## Verification
      - Run virtual-time retry tests plus in-process disconnect, token-invalidation, terminal-permission, resume, and close-race tests.

      ## Risks / Constraints
      - Concurrent failures must not trigger unsafe refresh storms or duplicate active subscriptions.

      ## Likely Modules / Files
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/subscription/
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/auth/

