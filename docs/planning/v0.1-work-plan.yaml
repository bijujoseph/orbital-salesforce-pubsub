    body: |
      <!-- work-item-key: OSP-032 -->

      ## Goal
      Bound subscription work and make every active, degraded, reconnecting, stopping, and terminal transition explicit.

      ## Scope
      Implement the state machine, validated FlowControlOptions, initial/refill demand accounting, max-in-flight enforcement, and keepalive handling.

      ## Requirement Sources
      - Blueprint §§6.8-6.10 and state/flow tests in §§10.2-10.4.

      ## Implementation Notes
      - Default request/refill/in-flight values are 10/2/10/20; keepalives update health but consume no event slot.

      ## Acceptance Criteria
      - Every legal blueprint transition succeeds and every illegal transition is rejected deterministically.
      - Initial demand and threshold refills never cause in-flight events to exceed the configured maximum.
      - Invalid flow-control combinations fail before opening a stream.
      - Keepalives emit no business event, and STOPPING prevents later demand, event emission, replay writes, or reconnect scheduling.

      ## Verification
      - Run exhaustive state-transition tests and deterministic demand/refill, invalid-config, keepalive, and post-STOPPING assertions.

      ## Risks / Constraints
      - Flow control must not equate gRPC buffering capacity with downstream processing capacity.

      ## Likely Modules / Files
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/subscription/
      - salesforce-pubsub-core/src/test/java/io/github/*/salesforce/pubsub/subscription/

