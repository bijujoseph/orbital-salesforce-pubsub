    body: |
      <!-- work-item-key: OSP-010 -->

      ## Goal
      Create a reproducible Java 21 Maven foundation with generated Salesforce protocol types and enforceable quality gates.

      ## Scope
      Covers module bootstrap, build conventions, CI quality/security checks, and Pub/Sub proto generation only.

      ## Requirement Sources
      - Blueprint §§3-4, 11, and implementation order steps 1-3.
      - Repository evidence: no build manifest or source/test tree exists; current CI skips Maven when no POM is found.

      ## Implementation Notes
      - Keep core free of Orbital, Taxi, and Spring dependencies and keep generated types internal to transport.

      ## Acceptance Criteria
      - OSP-011 through OSP-013 are complete and the root Maven reactor verifies on Java 21.
      - Pull-request CI enforces the blueprint quality and security baseline on the bootstrapped reactor.

      ## Verification
      - Run `mvn -B -ntp verify` from the repository root and inspect required CI jobs.

      ## Risks / Constraints
      - Build tooling must not introduce a runtime or product outside the blueprint.

      ## Likely Modules / Files
      - pom.xml
      - .github/workflows/
      - salesforce-pubsub-core/
      - salesforce-pubsub-cli/
      - orbital-salesforce-connector/
      - bom/

