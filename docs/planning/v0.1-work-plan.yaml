      <!-- work-item-key: OSP-051 -->

      ## Goal
      Establish the strongest truthful acknowledgement, checkpoint, backpressure, error, and cancellation behavior available in a specific released Orbital version.

      ## Scope
      Inspect supported-version Kafka and SQS sources, delivery callbacks, OperationInvoker/source-stream lifecycle, downstream completion/failure propagation, and cancellation.

      ## Requirement Sources
      - Blueprint §§6.7-6.8, 8.10, 10.5 checkpoint behavior, and mandatory stop condition §13.1.

      ## Implementation Notes
      - Produce a concise ADR/report naming the inspected released version and evidence; do not copy upstream code or design an acknowledgement API without an invocation point.

      ## Acceptance Criteria
      - The report states Kafka commit behavior, SQS acknowledge/delete behavior, downstream success/failure callback availability, OperationInvoker interaction, and cancellation propagation.
      - The report selects one implementable checkpoint rule and explicitly states whether Salesforce demand can couple to Orbital capacity.
      - If no downstream-success boundary exists, the report prohibits describing handler return as destination commit and retains the no-exactly-once statement.
      - Adapter implementation is marked blocked until this report is reviewed and its supported Orbital version is recorded.

      ## Verification
      - Reproduce cited behavior with bounded source inspection and focused connector-SPI tests or executable probes; review the report against every mandatory question.

      ## Risks / Constraints
      - This is a hard gate; unresolved or conflicting SPI evidence stops OSP-052 through OSP-056.

      ## Likely Modules / Files
      - docs/adr/
      - orbital-salesforce-connector/src/test/kotlin/

