    body: |
      <!-- work-item-key: OSP-031 -->

      ## Goal
      Select subscription starts deterministically and persist opaque replay checkpoints behind a replaceable SPI.

      ## Scope
      Implement LATEST/EARLIEST/ReplayId models, SubscribeRequest, ReplayStore, InMemoryReplayStore, stable namespace, and replay-start selection.

      ## Requirement Sources
      - Blueprint §§6.1-6.6 and replay tests in §10.2.

      ## Implementation Notes
      - Precedence is explicit ReplayId, then `connectionName + topic + consumerName` checkpoint, then configured initial preset.

      ## Acceptance Criteria
      - Explicit ReplayId overrides both stored state and preset; stored state overrides preset; preset applies only when neither exists.
      - InMemoryReplayStore keys by all three namespace components and copies replay bytes on load/save boundaries.
      - Consumer names are accepted as stable caller configuration and are never randomly regenerated during resume.
      - JDBC, DynamoDB, Redis, and HA durability claims are absent from v0.1.

      ## Verification
      - Run table-driven precedence, namespace-isolation, defensive-copy, LATEST, EARLIEST, and explicit-replay unit tests.

      ## Risks / Constraints
      - Replay IDs are stream positions, never event IDs, numeric offsets, or business keys.

      ## Likely Modules / Files
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/replay/
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/subscription/

  - key: "OSP-032"
