      <!-- work-item-key: OSP-033 -->

      ## Goal
      Open and close Salesforce subscription streams through the stable core handler contract.

      ## Scope
      Validate GetTopic/can_subscribe, build Subscribe requests, decode ConsumerEvents, deliver handler/lifecycle/error callbacks, and close stream resources.

      ## Requirement Sources
      - Blueprint §§5.2, 5.5, 6.6-6.10, and Subscribe cases in §10.4.

      ## Implementation Notes
      - Event order is retained for one subscription; callback completion alone is not described as downstream acknowledgement.

      ## Acceptance Criteria
      - GetTopic succeeds before Subscribe and invalid/non-subscribable topics cause terminal typed failure without opening a stream.
      - ConsumerEvents decode into SalesforceEvent in server order and keepalive responses emit no SalesforceEvent.
      - Explicit close cancels the client stream, releases local buffers, stops demand, and reaches STOPPED rather than FAILED.
      - Handler and lifecycle failures surface as typed subscription errors without raw payload or credential leakage.

      ## Verification
      - Run in-process ordered-event, keepalive, invalid-topic, handler-failure, explicit-close, and resource-leak tests.

      ## Risks / Constraints
      - No blocking network work may execute on a caller or future Orbital execution thread.

      ## Likely Modules / Files
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/subscription/
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/transport/

  - key: "OSP-034"
