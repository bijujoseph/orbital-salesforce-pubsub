    body: |
      <!-- work-item-key: OSP-025 -->

      ## Goal
      Give embedders actionable typed failures and optional low-cardinality lifecycle observability.

      ## Scope
      Implement the blueprint exception hierarchy, telemetry SPI with no-op default, SLF4J structured logging/redaction, metrics hooks, and application-level connector status.

      ## Requirement Sources
      - Blueprint §§5.1, 9.1-9.4, and definition of done §14.

      ## Implementation Notes
      - Route core logs through SLF4J, map authentication and authorization separately, and treat raw gRPC channel state as diagnostic detail rather than the complete health state.

      ## Acceptance Criteria
      - Defined failure categories map to their corresponding typed exceptions and preserve only safe context.
      - Core lifecycle and error logs are emitted through SLF4J at the blueprint-defined levels and can be bound by the embedding application without a core-imposed backend.
      - The no-op telemetry implementation requires no metrics system and does not alter behavior.
      - Health exposes STARTING, AUTHENTICATING, CONNECTED, SUBSCRIBED, RECONNECTING, DEGRADED, FAILED, and STOPPED according to connector lifecycle.
      - Always-required metrics use only low-cardinality labels and no credential, payload, customer-ID, or PII values.

      ## Verification
      - Run exception-mapping, health-transition, telemetry/no-op, metric-label, and SLF4J capture tests that assert levels, safe context, redaction, and backend independence.

      ## Risks / Constraints
      - Checkpoint age and processing-duration metrics remain disabled until OSP-051 proves their semantics.

      ## Likely Modules / Files
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/error/
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/telemetry/

