      Risk: "High"
      Target version: "0.1.0"
      Agent-ready: "No"
    body: |
      <!-- work-item-key: OSP-030 -->

      ## Goal
      Consume custom Platform Events with deterministic replay, bounded demand, explicit lifecycle, reconnect, and cancellation behavior.

      ## Scope
      Covers core Subscribe only; ManagedSubscribe and unverified downstream acknowledgement semantics remain excluded.

      ## Requirement Sources
      - Blueprint §6, §§10.2-10.4 subscription cases, and definition of done §14.

      ## Implementation Notes
      - Preserve replay IDs as opaque bytes and prohibit all demand, emission, checkpoint writes, and reconnect scheduling after STOPPING.

      ## Acceptance Criteria
      - OSP-031 through OSP-036 are complete with deterministic success, failure, lifecycle, security, and compatibility verification.
      - The public asynchronous subscription API supports LATEST, EARLIEST, and explicit replay while remaining independent of OrbitalHQ.

      ## Verification
      - Run the subscription unit/state-machine and in-process protocol suites referenced by child issues.

      ## Risks / Constraints
      - The connector must not claim exactly-once delivery or invent an acknowledgement boundary.

      ## Likely Modules / Files
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/subscription/
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/replay/

