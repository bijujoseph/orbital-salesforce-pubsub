      ## Goal
      Generate Java client types for the exact Pub/Sub API surface required by v0.1.

      ## Scope
      Add Maven protobuf/gRPC generation for `GetTopic`, `GetSchema`, `Subscribe`, and unary `Publish`; exclude ManagedSubscribe and PublishStream implementation.

      ## Requirement Sources
      - Blueprint §4.2 and implementation order step 3.

      ## Implementation Notes
      - Generated Salesforce classes remain transport implementation details and are not exported from stable core APIs.

      ## Acceptance Criteria
      - A clean Maven build deterministically generates and compiles stubs containing all four required RPCs.
      - Public core API signatures contain no Salesforce-generated protobuf or gRPC types.
      - No v0.1 runtime path invokes ManagedSubscribe, PublishStream, or batch publishing.

      ## Verification
      - Run `mvn -B -ntp -pl salesforce-pubsub-core clean verify` and an API-surface check for generated-package leakage.

      ## Risks / Constraints
      - Proto version changes can alter generated code; dependency and generation versions must be pinned or centrally managed.

