      Target version: "0.1.0"
      Agent-ready: "No"
    body: |
      <!-- work-item-key: OSP-022 -->

      ## Goal
      Establish secure asynchronous HTTP/2 transport that attaches the current Salesforce session to each RPC.

      ## Scope
      Implement channel lifecycle, asynchronous stubs, transport abstraction, and CallCredentials or scoped interceptor metadata for `accesstoken`, `instanceurl`, and `tenantid`.

      ## Requirement Sources
      - Blueprint §§5.2 and 5.4.

      ## Implementation Notes
      - Read session metadata atomically for each new RPC and keep blocking replay stores off Orbital execution threads later.

      ## Acceptance Criteria
      - An in-process server receives all three required metadata values for each RPC.
      - RPCs started after refresh receive refreshed values while concurrent calls never observe a mixed session.
      - Access tokens, instance URLs used as credentials, tenant IDs, and auth headers are absent from ordinary logs and exception messages.
      - Client close terminates channel resources without blocking an Orbital execution thread.

      ## Verification
      - Run focused metadata, refresh-concurrency, redaction, and channel-close tests against an in-process gRPC server.

      ## Risks / Constraints
      - Metadata must be scoped to Salesforce RPCs and must not be cached beyond session refresh.

      ## Likely Modules / Files
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/transport/
      - salesforce-pubsub-core/src/test/java/io/github/*/salesforce/pubsub/transport/

  - key: "OSP-023"
    type: "Task"
    title: "Implement topic validation, schema resolution, and bounded cache"
    parent: "OSP-020"
    depends_on:
      - "OSP-022"
    labels: []
    project_fields:
      Status: "Backlog"
      ItemType: "Task"
      Priority: "P0"
      Area: "Core"
      Phase: "Phase 0"
      Size: "L"
      Risk: "Medium"
      Target version: "0.1.0"
      Agent-ready: "No"
    body: |
      <!-- work-item-key: OSP-023 -->

      ## Goal
      Resolve and validate topics and schemas while bounding schema memory and remote calls.

      ## Scope
      Implement GetTopic, GetSchema, operation-specific capability checks, schema parsing, and the schema-ID cache.

      ## Requirement Sources
      - Blueprint §§5.5-5.6 and testing §10.2 topic/schema cases.

      ## Implementation Notes
      - Use schema ID as the cache key, maximum size 100, 24-hour expire-after-access, and expose hit/miss/load-failure/eviction telemetry.

      ## Acceptance Criteria
      - Unknown, non-subscribable, and non-publishable topics fail with the applicable typed error before Subscribe or Publish.
      - The caller-supplied topic string is passed unchanged to GetTopic and subsequent Subscribe or Publish requests; invalid names are neither rewritten nor used to infer an object name.
      - A cache miss performs GetSchema, a hit avoids it, and a new schema ID performs a separate lookup.
      - The cache never exceeds 100 entries, expires idle entries after 24 hours, and a load failure does not poison later retries indefinitely.
      - Observable schema-cache telemetry reports hits, misses, load failures, and evictions with the correct count for each exercised outcome.
      - Missing required schema IDs and non-retriable schema failures are surfaced with safe context.

      ## Verification
      - Run in-process topic tests that record exact pass-through for valid and invalid sentinel names and assert no rewrite or object-name inference before failure.
      - Run deterministic clock/cache tests and in-process GetTopic/GetSchema success, permission, timeout, failure, new-schema, and hit/miss/load-failure/eviction metric-count tests.

      ## Risks / Constraints
      - A schema ID is not treated as a permanent Taxi model version.

      ## Likely Modules / Files
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/schema/
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/transport/

  - key: "OSP-024"
    type: "Task"
    title: "Implement neutral event models and Avro codec"
    parent: "OSP-020"
    depends_on:
      - "OSP-023"
    labels: []
    project_fields:
      Status: "Backlog"
      ItemType: "Task"
      Priority: "P0"
      Area: "Core"
      Phase: "Phase 0"
      Size: "L"
      Risk: "High"
      Target version: "0.1.0"
      Agent-ready: "No"
    body: |
      <!-- work-item-key: OSP-024 -->

      ## Goal
      Convert Salesforce Avro payloads to and from neutral Java values without exposing protocol-generated types.

      ## Scope
      Implement SalesforceEvent plus decode/encode support for all v0.1 scalar, logical, nullable, array, and nested-record cases.

      ## Requirement Sources
      - Blueprint §§5.7-5.8 and testing §10.2 Avro cases.

      ## Implementation Notes
      - Normalize Avro Utf8 to String and defensively copy or immutably wrap replay bytes at public boundaries.

      ## Acceptance Criteria
      - Round-trip tests cover strings, booleans, integers/longs, floating values, dates, timestamps, nulls, nullable unions, arrays, and nested records.
      - Malformed/incompatible decode raises EventDecodeException; missing required or wrong-type encode raises EventEncodeException before network publication.
      - Errors may include safe topic/schema/event/replay-hash context but never full raw payloads.
      - When Salesforce supplies an event ID, the SalesforceEvent exposes that value as its default event identity; replay ID is never selected as the default identity.
      - Replay IDs remain opaque bytes and are never incremented, numerically compared, synthesized, or used as event identity.

      ## Verification
      - Run parameterized Avro unit tests, mutation/defensive-copy tests, captured-error redaction assertions, and identity-selection tests with Salesforce event ID present and absent.

      ## Risks / Constraints
      - Base64 is permitted only at textual boundaries, not in the neutral core model.

      ## Likely Modules / Files
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/model/
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/schema/

  - key: "OSP-025"
    type: "Task"
    title: "Implement typed errors, lifecycle telemetry, and health"
    parent: "OSP-020"
    depends_on:
