    body: |
      <!-- work-item-key: OSP-021 -->

      ## Goal
      Validate connector configuration and supply current Salesforce sessions through the two v0.1 authentication modes.

      ## Scope
      Implement endpoint, flow-control, retry, and client configuration plus the authentication SPI, client-credentials provider, and caller-supplied session provider.

      ## Requirement Sources
      - Blueprint §§5.2-5.3, 6.8, 6.11, and implementation order steps 4-7.

      ## Implementation Notes
      - Use asynchronous APIs, validate missing token/instance URL, and serialize or coalesce concurrent refresh safely.

      ## Acceptance Criteria
      - Valid client-credentials acquisition and caller-supplied sessions produce a nonblank access token, instance URL, tenant ID, and user ID where supplied.
      - Missing required values fail before transport use with typed configuration/authentication errors.
      - Concurrent authentication or refresh does not expose a partially updated session or leak secrets in logs/exceptions.
      - JWT, browser authorization-code, and username/password grants are not implemented.

      ## Verification
      - Run focused JUnit tests for both providers, invalid configuration, concurrent refresh, and captured-log redaction.

      ## Risks / Constraints
      - OAuth responses and errors may contain secrets; sanitization must occur before logging or exception construction.

      ## Likely Modules / Files
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/config/
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/auth/

  - key: "OSP-022"
    type: "Task"
    title: "Implement asynchronous gRPC transport and session metadata"
    parent: "OSP-020"
    depends_on:
      - "OSP-013"
      - "OSP-021"
    labels: []
    project_fields:
      Status: "Backlog"
