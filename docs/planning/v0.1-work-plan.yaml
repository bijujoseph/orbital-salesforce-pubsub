    body: |
      <!-- work-item-key: OSP-001 -->

      ## Goal
      Deliver a focused 0.1.0 library and OrbitalHQ connector that consumes and publishes Salesforce custom Platform Events through the Pub/Sub API.

      ## Scope
      Encompasses the reusable Java core, CLI, thin Kotlin Orbital adapter, verification, documentation, and signed Maven Central release; all explicit v0.1 non-goals remain excluded.

      ## Requirement Sources
      - Blueprint §§1-4, 13-15 define release scope, architecture, sequencing, and definition of done.

      ## Implementation Notes
      - Prove the Salesforce protocol through the CLI before adapter implementation, and do not claim exactly-once delivery.

      ## Acceptance Criteria
      - Every child Feature and its required work items is complete with its bounded verification evidence.
      - Both Salesforce-to-Orbital Stream<T> consumption and Orbital-to-Salesforce unary publication pass the v0.1 acceptance suite.
      - Release artifacts and documentation satisfy the blueprint definition of done without implementing any declared non-goal.

      ## Verification
      - Review child issue completion and the final release-readiness evidence in OSP-083.
      - Run the complete Maven verification, integration, security, packaging, and release smoke checks defined by the completed child issues.

      ## Risks / Constraints
      - Real-org credentials and the supported Orbital SPI are external gates; delivery claims must remain limited to verified behavior.

      ## Likely Modules / Files
      - pom.xml and all Maven modules
      - docs/
      - .github/workflows/

