      <!-- work-item-key: OSP-052 -->

      ## Goal
      Represent source, sink, connection, replay preset, and optional metadata declarations distinctly and reject invalid Taxi contracts early.

      ## Scope
      Implement SalesforcePubSubService, SalesforceSubscribe, SalesforcePublish, SalesforceReplayPreset, SalesforceEventMetadata, and compatible declaration validation.

      ## Requirement Sources
      - Blueprint §§8.2-8.4 and adapter tests in §10.5.

      ## Implementation Notes
      - Subscribe is read plus Stream<T>; Publish is write with exactly one payload; raw replay IDs are never annotation fields.

      ## Acceptance Criteria
      - Valid service, subscribe, publish, replay preset, and metadata annotations are recognized by the supported Orbital/Taxi release.
      - Subscribe rejects non-read operations, non-Stream<T> returns, blank topics, and invalid presets with actionable declaration locations.
      - Publish rejects non-write operations, parameter counts other than one, and blank topics; service rejects blank connection names.
      - Metadata annotations reject incompatible fields, and no annotation permits a raw custom replay token.

      ## Verification
      - Run positive and negative Taxi compilation/validation fixtures for every rule and compare actionable diagnostics.

      ## Risks / Constraints
      - Separate source and sink annotations must not be replaced with one overloaded operation annotation.

      ## Likely Modules / Files
      - orbital-salesforce-connector/src/main/resources/
      - orbital-salesforce-connector/src/main/kotlin/
      - orbital-salesforce-connector/src/test/resources/

