      <!-- work-item-key: OSP-053 -->

      ## Goal
      Resolve safe named Salesforce connections and route declared read/write operations to the matching core behavior.

      ## Scope
      Implement configuration parsing/validation, secret references, connection lookup, supported-version OperationInvoker integration, read subscription routing, and write publish routing.

      ## Requirement Sources
      - Blueprint §§8.1, 8.9-8.10 and implementation order steps 33-34.

      ## Implementation Notes
      - Startup may validate config references but must not eagerly subscribe to every declared source; event-stream response caching is disabled/avoided.

      ## Acceptance Criteria
      - A valid named connection maps auth, endpoint, subscription, retry, and gRPC values into core configuration without placing secrets in Taxi.
      - Missing connection, unresolved required secret, and invalid flow/retry settings fail with actionable configuration errors before remote use.
      - Read declarations invoke subscription and return the supported streaming type; write declarations invoke unary publish and return the supported result type.
      - No source stream is opened until Orbital starts its corresponding query, and event-stream responses are not cached as ordinary reads.

      ## Verification
      - Run configuration fixture, secret-redaction, lazy-start, routing, and response-cache behavior tests against the supported Orbital version.

      ## Risks / Constraints
      - Environment values SF_LOGIN_URL, SF_CLIENT_ID, and SF_CLIENT_SECRET must never enter generated Taxi or logs.

