    body: |
      <!-- work-item-key: OSP-034 -->

      ## Goal
      Prevent silent data loss or unexpected replay when Salesforce rejects a replay position.

      ## Scope
      Map invalid-replay responses and apply ERROR, EARLIEST, or LATEST exactly as explicitly configured, with ERROR as default.

      ## Requirement Sources
      - Blueprint §§6.4 and 6.11 plus replay tests in §§10.2, 10.4, and 10.7.

      ## Implementation Notes
      - Only INVALID_ARGUMENT identified as invalid replay uses this policy; permission, topic, and configuration failures stay terminal.

      ## Acceptance Criteria
      - Default ERROR raises InvalidReplayException and sends no fallback subscription request.
      - Explicit EARLIEST or LATEST sends exactly that fallback and records a lifecycle/telemetry event describing the reset.
      - Invalid replay never silently changes policy, advances replay bytes, or retries forever.

      ## Verification
      - Run in-process invalid-replay tests for all three policies and assert request count, preset, typed error, and log redaction.

      ## Risks / Constraints
      - Recovery resets can lose or duplicate events and therefore require explicit configuration.

      ## Likely Modules / Files
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/replay/
      - salesforce-pubsub-core/src/main/java/io/github/*/salesforce/pubsub/subscription/

  - key: "OSP-035"
