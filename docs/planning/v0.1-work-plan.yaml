    body: |
      <!-- work-item-key: OSP-011 -->

      ## Goal
      Provide the compilable module and dependency boundary required for all connector work.

      ## Scope
      Create the root reactor plus core, CLI, Orbital adapter, BOM, examples, and required source/test directory scaffolds with the 0.1.0 coordinates.

      ## Requirement Sources
      - Blueprint §§3.1-3.2 and 4.1.
      - Repository evidence: the current bootstrap has no POM or application/test source tree.

      ## Implementation Notes
      - Configure Java 21 and SLF4J logging; Kotlin is confined to the adapter, and the CLI depends on core rather than duplicating protocol code.

      ## Acceptance Criteria
      - The root reactor lists `salesforce-pubsub-core`, `salesforce-pubsub-cli`, `orbital-salesforce-connector`, `bom`, and `examples` and assigns the specified artifact IDs.
      - `salesforce-pubsub-core` has no OrbitalHQ, Taxi, or Spring dependency in its effective POM.
      - Modules that log compile against SLF4J, and the reusable core does not impose a concrete logging backend on embedding applications.
      - A clean Java 21 build compiles every empty/scaffolded module and installs the BOM locally.

      ## Verification
      - Run `mvn -B -ntp clean verify` and inspect `mvn -pl salesforce-pubsub-core dependency:tree` for forbidden dependencies, the SLF4J API, and absence of a core runtime logging binding.

      ## Risks / Constraints
      - The actual organization segment in Maven coordinates must be selected consistently without exposing generated transport types as public API.

      ## Likely Modules / Files
      - pom.xml
      - salesforce-pubsub-core/pom.xml
      - salesforce-pubsub-cli/pom.xml
      - orbital-salesforce-connector/pom.xml
      - bom/pom.xml
      - examples/pom.xml

  - key: "OSP-012"
