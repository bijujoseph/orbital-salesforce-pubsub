      <!-- work-item-key: OSP-055 -->

      ## Goal
      Adapt core subscriptions to Orbital Stream<TypedInstance> with bounded demand and complete cancellation, error, and checkpoint propagation.

      ## Scope
      Implement the exact OSP-051-selected stream bridge, capacity coupling where supported, query cancellation/timeout/normal termination, and checkpoint timing.

      ## Requirement Sources
      - Blueprint §§6.7-6.8, 8.8, 8.10, and stream/checkpoint tests in §10.5.

      ## Implementation Notes
      - Persist only after true downstream success if such a callback exists; otherwise implement and document the weaker verified boundary without calling it destination commit.

      ## Acceptance Criteria
      - Orbital cancellation, timeout, and normal termination stop demand, cancel gRPC, cancel reconnects, release buffers, close resources, and preserve already durable replay state.
      - Normal cancellation reaches STOPPED, not FAILED, and repeated start/cancel cycles leave no orphan thread, coroutine, channel, or stream.
      - Demand couples to downstream capacity only where the supported SPI exposes it and never exceeds core max-in-flight bounds.
      - Checkpoint writes and delivery language exactly match the reviewed OSP-051 contract and never claim exactly-once.

      ## Verification
      - Run supported-version cancellation, timeout, error, backpressure, checkpoint-success/failure, race, and resource-leak tests.

      ## Risks / Constraints
      - Any conflict with OSP-051 evidence stops implementation for human resolution.

      ## Likely Modules / Files
      - orbital-salesforce-connector/src/main/kotlin/
      - orbital-salesforce-connector/src/test/kotlin/

